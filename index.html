<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你的站点</title>
<meta name="description" content="一句话介绍你自己或这个站点。">
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#6b7280; --line:#e7e9ec; --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --line:#262a31; --accent:#7aa2f7; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:660px;margin:0 auto;padding:80px 24px 64px}
  h1{font-size:2rem;line-height:1.25;margin:0 0 10px;letter-spacing:-.015em;font-weight:700}
  .tag{color:var(--muted);margin:0 0 44px}
  h2{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
     margin:40px 0 6px;font-weight:600}
  p{margin:0 0 16px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  ul{list-style:none;padding:0;margin:0}
  li{padding:14px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  .k{display:block;font-weight:600;color:inherit}
  a.k:hover{color:var(--accent);text-decoration:none}
  .d{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 改这里：标题 + 一句话介绍 ===== -->
  <h1>你好，我是 XXX</h1>
  <p class="tag">做嵌入式与硬件相关的东西。这里放我的项目和笔记。</p>
  <!-- ===== 改到这里 ===== -->

  <h2>项目</h2>
  <ul>
    <li>
      <a class="k" href="#">项目一 · 一句话说明</a>
      <span class="d">ESP32-S3 / 数据采集与上报</span>
    </li>
    <li>
      <a class="k" href="#">项目二 · 一句话说明</a>
      <span class="d">Jetson Orin NX / 边缘推理</span>
    </li>
  </ul>

  <h2>联系</h2>
  <ul>
    <li>
      <a class="k" href="mailto:me@example.com">me@example.com</a>
      <span class="d">邮件</span>
    </li>
    <li>
      <a class="k" href="https://github.com/">GitHub</a>
      <span class="d">代码</span>
    </li>
  </ul>

  <footer>
    占位页面 · 把 XXX 和上面几行换成你的内容，重新上传即可
  </footer>

</div>
</body>
</html>
